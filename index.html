<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 시대, 교사의 시간</title>

  <!-- 글꼴: Pretendard (인터넷에서 불러와요) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 무대: 항상 1456 × 816 크기, 브라우저 크기에 맞춰 확대·축소돼요 -->
  <div id="stage">

    <!-- 장면 12개. 내용은 js/scenes.js가 장면을 시작할 때 채워 넣어요 -->
    <section class="scene" id="scene1"></section>
    <section class="scene" id="scene2">
      <div class="s2-scroll" id="s2-scroll"><div class="s2-grid" id="s2-grid"></div></div>
    </section>
    <section class="scene" id="scene3"></section>
    <section class="scene" id="scene4"></section>
    <section class="scene" id="scene5"></section>
    <section class="scene" id="scene6"></section>
    <section class="scene" id="scene7"></section>
    <section class="scene" id="scene8"></section>
    <section class="scene" id="scene9"></section>
    <section class="scene" id="scene10"></section>
    <section class="scene" id="scene11"></section>
    <section class="scene" id="scene12"></section>

    <!-- 장면 위를 덮는 것들 -->
    <div id="curtain">
      <div class="cloth left"></div>
      <div class="cloth right"></div>
      <div class="rod"></div>
    </div>
    <div id="fader"></div>
    <div id="modal"></div>
    <div id="next-hint">클릭해서 계속 ▼</div>
  </div>

  <!-- 화면 밖 작은 버튼 -->
  <button id="fullscreen-btn" title="전체 화면">⛶</button>

  <script src="data/cards.js"></script>
  <script src="data/interview.js"></script>
  <script src="data/articles.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scenes.js"></script>
</body>
</html>
